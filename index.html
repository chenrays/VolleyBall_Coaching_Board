<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volleyball Tactics v8</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #222;
            --court-color: #000000;
            --line-color: #ffffff;
            --out-color: #333333;
            --team-a-base: #89CFF0;
            /* A隊 寶寶藍 */
            --team-b-base: #FFB6C1;
            /* B隊 淡粉色 */
            --libero-color: #f1c40f;
            --text-color: #eee;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            height: 100vh;
            color: var(--text-color);
            overflow: hidden;
        }

        /* --- 1. 左極側工具 (全域) --- */
        .global-tools {
            width: 60px;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 12px;
            border-right: 1px solid #444;
            z-index: 300;
            flex-shrink: 0;
        }

        .tool-btn {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            position: relative;
        }

        .tool-btn.active {
            background: #2ecc71;
            border-color: #2ecc71;
        }

        .tool-btn:active {
            transform: scale(0.9);
        }

        .tool-label {
            font-size: 9px;
            position: absolute;
            bottom: 2px;
            color: #ccc;
            zoom: 0.8;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
        }

        input[type="color"] {
            width: 25px;
            height: 25px;
            border: none;
            cursor: pointer;
            padding: 0;
            background: none;
            border-radius: 50%;
        }

        input[type="range"] {
            width: 40px;
            cursor: pointer;
        }

        /* --- 2. 隊伍面板 (左B 右A) --- */
        /* 為了解決 "對手B隊那邊...不能直接將A隊的給B隊用" 
           我們在介面上也做區隔，左邊面板控B隊，右邊面板控A隊 */

        .team-panel {
            width: 135px;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            border-left: 1px solid #333;
            flex-shrink: 0;
            padding: 8px;
            gap: 10px;
            overflow-y: auto;
        }

        .panel-header {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding-bottom: 5px;
            border-bottom: 3px solid;
            margin-bottom: 5px;
        }

        .header-b {
            color: var(--team-b-base);
            border-color: var(--team-b-base);
        }

        .header-a {
            color: var(--team-a-base);
            border-color: var(--team-a-base);
        }

        .control-group {
            background: #2a2a2a;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border: 1px solid #333;
        }

        .control-label {
            font-size: 10px;
            color: #888;
            text-align: center;
            margin-bottom: 2px;
        }

        .rot-btns {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            flex: 1;
            padding: 6px 2px;
            font-size: 11px;
            cursor: pointer;
            background: #444;
            border: none;
            color: white;
            border-radius: 4px;
        }

        .action-btn:hover {
            background: #555;
        }

        .swap-btn {
            background: #d35400;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .swap-btn:hover {
            background: #e67e22;
        }

        .bench-area {
            flex-grow: 1;
            background: #181818;
            border: 1px dashed #444;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-height: 120px;
        }

        /* --- 3. 中央球場 --- */
        .main-stage {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 垂直置中 */
            background: #000;
            overflow: auto;
            padding: 10px;
        }

        #court-container {
            position: relative;
            width: 360px;
            height: 680px;
            background-color: var(--out-color);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
            user-select: none;
        }

        .court-lines {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            height: 640px;
            background-color: var(--court-color);
            border: 4px solid var(--line-color);
            box-sizing: content-box;
        }

        .line {
            position: absolute;
            background-color: var(--line-color);
        }

        .center-line {
            width: 100%;
            height: 4px;
            top: 320px;
        }

        .line-attack-top {
            width: 100%;
            height: 4px;
            top: 213px;
        }

        /* B隊攻擊線 */
        .line-attack-bot {
            width: 100%;
            height: 4px;
            top: 426px;
        }

        /* A隊攻擊線 */

        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* --- 球員樣式 --- */
        .entity {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 15px;
            color: #222;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            cursor: grab;
            z-index: 20;
            border: 2px solid white;
            transition: transform 0.1s;
        }

        .entity:active {
            cursor: grabbing;
            transform: scale(1.15);
            z-index: 100;
        }

        .team-a {
            background-color: var(--team-a-base);
        }

        .team-b {
            background-color: var(--team-b-base);
        }

        .libero {
            background-color: var(--libero-color);
            border-color: #222;
        }

        .name-tag {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
        }

        .ball {
            background: radial-gradient(circle at 10px 10px, #fff, #ccc);
            width: 24px;
            height: 24px;
            border: none;
            z-index: 30;
        }

        .ball::after {
            content: "🏐";
            font-size: 24px;
            line-height: 24px;
            margin-left: -2px;
        }

        /* 編輯彈窗 */
        #edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            width: 220px;
            border: 1px solid #555;
            text-align: center;
        }

        .modal-box input {
            width: 90%;
            margin: 10px 0;
            padding: 8px;
            background: #222;
            border: 1px solid #555;
            color: white;
        }

        .modal-box button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        .save-btn {
            background: #2ecc71;
            color: white;
        }

        .cancel-btn {
            background: #555;
            color: white;
        }
    </style>
</head>

<body>

    <div class="global-tools">
        <button onclick="setMode('move')" id="btn-move" class="tool-btn active">✋<span
                class="tool-label">移動</span></button>
        <button onclick="setMode('draw')" id="btn-draw" class="tool-btn">✏️<span class="tool-label">畫筆</span></button>
        <button onclick="setMode('erase')" id="btn-erase" class="tool-btn">🧹<span class="tool-label">橡皮</span></button>

        <div class="setting-group">
            <input type="color" id="pen-color" value="#ffff00" title="筆色">
            <input type="range" id="pen-size" min="1" max="10" value="3" title="粗細">
        </div>

        <button onclick="clearInk()" class="tool-btn" title="清除筆跡">
            ✨<span class="tool-label" style="font-size:8px; bottom:2px">清筆跡</span>
        </button>

        <div style="flex-grow:1"></div>
        <button onclick="resetPositions()" class="tool-btn" style="color:#f1c40f">⚡<span
                class="tool-label">歸位</span></button>
        <button onclick="fullReset()" class="tool-btn" style="color:#e74c3c">⚠️<span
                class="tool-label">重置</span></button>
    </div>

    <div class="team-panel">
        <div class="panel-header header-b">B 隊 (對手)</div>

        <div class="control-group">
            <div class="control-label">輪轉控制</div>
            <div class="rot-btns">
                <button onclick="rotateTeam('B', -1)" class="action-btn">◀ 上一輪</button>
                <button onclick="rotateTeam('B', 1)" class="action-btn">下一輪 ▶</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-label">B隊 自由換人</div>
            <div id="libero-controls-b"></div>
        </div>

        <div class="bench-area" id="bench-b">
            <div class="control-label">B隊 板凳</div>
            <button onclick="addPlayer('B')" class="action-btn" style="width:100%">➕ 新增</button>
        </div>
    </div>

    <div class="main-stage">
        <div id="court-container">
            <div class="court-lines">
                <div class="line center-line"></div>
                <div class="line line-attack-top"></div>
                <div class="line line-attack-bot"></div>
            </div>
            <canvas id="drawing-canvas"></canvas>
            <div id="entities-layer"></div>
        </div>
    </div>

    <div class="team-panel">
        <div class="panel-header header-a">A 隊 (我方)</div>

        <div class="control-group">
            <div class="control-label">輪轉控制</div>
            <div class="rot-btns">
                <button onclick="rotateTeam('A', -1)" class="action-btn">◀ 上一輪</button>
                <button onclick="rotateTeam('A', 1)" class="action-btn">下一輪 ▶</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-label">A隊 自由換人</div>
            <div id="libero-controls-a"></div>
        </div>

        <div class="bench-area" id="bench-a">
            <div class="control-label">A隊 板凳</div>
            <button onclick="addPlayer('A')" class="action-btn" style="width:100%">➕ 新增</button>
        </div>
    </div>

    <div id="edit-modal">
        <div class="modal-box">
            <h4 style="color:white; margin:0">編輯資料</h4>
            <input type="text" id="modal-num" placeholder="背號" maxlength="3">
            <input type="text" id="modal-name" placeholder="名字" maxlength="6">
            <div>
                <button class="cancel-btn" onclick="closeModal()">取消</button>
                <button class="save-btn" onclick="savePlayerEdit()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('court-container');
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const entitiesLayer = document.getElementById('entities-layer');
        const benchA = document.getElementById('bench-a');
        const benchB = document.getElementById('bench-b');

        const penColorInput = document.getElementById('pen-color');
        const penSizeInput = document.getElementById('pen-size');
        const CW = 360; const CH = 680;
        canvas.width = CW; canvas.height = CH;

        let mode = 'move';
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let draggedEntity = null;
        let editTarget = null;
        let touchOffsetX = 0, touchOffsetY = 0;

        // --- 核心：座標定義 (修正B隊視角) ---
        // A隊 (下方)
        // 4(前左) 3(前中) 2(前右)
        // 5(後左) 6(後中) 1(後右)

        // B隊 (上方 - 對手視角)
        // 當我們看螢幕上方時：
        // 1 號位 (發球位) 在 B 隊的 "右後方"，對應螢幕的 "左上角"。
        // 2 號位 (前排右) 在 B 隊的 "右前方"，對應螢幕的 "左下角" (網前)。
        // 4 號位 (前排左) 在 B 隊的 "左前方"，對應螢幕的 "右下角" (網前)。
        // 5 號位 (後排左) 在 B 隊的 "左後方"，對應螢幕的 "右上角"。

        function getInitPos(team, zone) {
            // A隊座標 (不變)
            const Ax_Left = 80, Ax_Mid = 180, Ax_Right = 280;
            const Ay_Front = 400; const Ay_Back = 560;

            // B隊座標 (完全鏡像旋轉 180度)
            // 螢幕左側 (Left) 對應 B隊的 Right Zone
            const Bx_ScreenLeft = 80;  // B隊的右路
            const Bx_ScreenMid = 180;
            const Bx_ScreenRight = 280; // B隊的左路

            const By_ScreenTop = 60;   // B隊後排 (Back)
            const By_ScreenNet = 260;  // B隊前排 (Front)

            if (team === 'A') {
                switch (zone) {
                    case 4: return { x: Ax_Left, y: Ay_Front };
                    case 3: return { x: Ax_Mid, y: Ay_Front };
                    case 2: return { x: Ax_Right, y: Ay_Front };
                    case 5: return { x: Ax_Left, y: Ay_Back };
                    case 6: return { x: Ax_Mid, y: Ay_Back };
                    case 1: return { x: Ax_Right, y: Ay_Back };
                }
            } else {
                // B隊 修正邏輯
                switch (zone) {
                    case 1: return { x: Bx_ScreenLeft, y: By_ScreenTop };  // 發球位 (右後) -> 螢幕左上
                    case 2: return { x: Bx_ScreenLeft, y: By_ScreenNet };  // 前排右 -> 螢幕左下
                    case 3: return { x: Bx_ScreenMid, y: By_ScreenNet };   // 前排中
                    case 4: return { x: Bx_ScreenRight, y: By_ScreenNet }; // 前排左 -> 螢幕右下
                    case 5: return { x: Bx_ScreenRight, y: By_ScreenTop }; // 後排左 -> 螢幕右上
                    case 6: return { x: Bx_ScreenMid, y: By_ScreenTop };   // 後排中
                }
            }
            return { x: 0, y: 0 };
        }

        // --- 物件建立 ---
        function createPlayer(team, number, name, x, y, zone) {
            const div = document.createElement('div');
            let cls = '';
            if (team.includes('L_')) {
                cls = 'libero';
                div.id = team === 'L_A' ? 'Libero_A' : 'Libero_B';
            } else {
                cls = team === 'A' ? 'team-a' : 'team-b';
            }
            // 賦予不重複ID以利追蹤
            if (!div.id) div.id = `p_${team}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;

            div.className = `entity ${cls}`;
            div.dataset.team = team.replace('L_', '');
            div.dataset.number = number;
            div.dataset.name = name;
            div.dataset.zone = zone;

            updatePlayerHTML(div);

            div.addEventListener('mousedown', startDrag);
            div.addEventListener('touchstart', startDrag, { passive: false });
            div.addEventListener('dblclick', () => openEditModal(div));

            if (zone === 'bench') {
                div.style.position = 'relative'; div.style.marginBottom = '10px';
                const targetBench = (team === 'B' || team === 'L_B') ? benchB : benchA;
                targetBench.appendChild(div);
            } else {
                div.style.left = (x - 18) + 'px'; div.style.top = (y - 18) + 'px';
                entitiesLayer.appendChild(div);
            }
            return div;
        }

        function updatePlayerHTML(div) {
            div.innerHTML = `${div.dataset.number}<div class="name-tag">${div.dataset.name}</div>`;
        }

        function createBall() {
            const ball = document.createElement('div');
            ball.className = 'entity ball';
            ball.style.left = '168px'; ball.style.top = '328px';
            ball.addEventListener('mousedown', startDrag);
            ball.addEventListener('touchstart', startDrag, { passive: false });
            entitiesLayer.appendChild(ball);
        }

        // --- 初始化與重置 ---
        function initGame() {
            entitiesLayer.innerHTML = '';
            cleanBench(benchA); cleanBench(benchB);

            // A隊初始
            [4, 3, 2, 5, 6, 1].forEach(z => {
                const pos = getInitPos('A', z);
                createPlayer('A', z, '', pos.x, pos.y, z);
            });
            // B隊初始 (注意：雖然座標修正了，但初始站位號碼邏輯還是這幾個位置)
            // 這裡我們直接生成標準站位 1~6
            [4, 3, 2, 5, 6, 1].forEach(z => {
                const pos = getInitPos('B', z);
                createPlayer('B', z, '', pos.x, pos.y, z);
            });

            createPlayer('L_A', 'L', '自由', 0, 0, 'bench');
            createPlayer('L_B', 'L', '自由', 0, 0, 'bench');
            createBall();
            updateAllLiberoControls();
        }

        function cleanBench(benchEl) {
            const players = benchEl.querySelectorAll('.entity');
            players.forEach(p => benchEl.removeChild(p));
        }

        function clearInk() { ctx.clearRect(0, 0, CW, CH); }

        function resetPositions() {
            const players = document.querySelectorAll('.entity');
            players.forEach(p => {
                if (p.parentElement === entitiesLayer && !p.classList.contains('ball')) {
                    const z = parseInt(p.dataset.zone);
                    const team = p.dataset.team;
                    if (!isNaN(z)) {
                        const pos = getInitPos(team, z);
                        p.style.transition = '0.5s ease';
                        p.style.left = (pos.x - 18) + 'px';
                        p.style.top = (pos.y - 18) + 'px';
                        setTimeout(() => { p.style.transition = ''; }, 500);
                    }
                }
            });
        }

        function fullReset() {
            if (confirm("確定重置所有內容？")) {
                initGame();
                clearInk();
            }
        }

        // --- 輪轉邏輯 (雙隊獨立處理) ---
        function rotateTeam(team, dir) {
            const allOnCourt = Array.from(entitiesLayer.querySelectorAll('.entity'));
            const teamOnCourt = allOnCourt.filter(p => p.dataset.team === team && !p.classList.contains('ball'));

            if (teamOnCourt.length === 0) return;

            const order = [1, 6, 5, 4, 3, 2];

            teamOnCourt.forEach(p => {
                const z = parseInt(p.dataset.zone);
                if (order.includes(z)) {
                    let idx = order.indexOf(z);
                    let newIdx = idx + dir;
                    if (newIdx >= order.length) newIdx = 0;
                    if (newIdx < 0) newIdx = order.length - 1;

                    const nextZ = order[newIdx];
                    p.dataset.zone = nextZ;

                    // 根據新 Zone 取得新座標 (因為 getInitPos 已經修正了B隊邏輯，這裡直接用即可)
                    const pos = getInitPos(team, nextZ);

                    p.style.transition = '0.3s';
                    p.style.left = (pos.x - 18) + 'px';
                    p.style.top = (pos.y - 18) + 'px';
                    setTimeout(() => p.style.transition = '', 300);
                }
            });

            // 自由球員自動退場檢查
            // A隊自由球員 前排禁區是 4號位
            // B隊自由球員 前排禁區也是 4號位 (但座標在螢幕右下)
            // 邏輯通用：如果 Zone == 4，且方向是「下一輪」(從5轉到4)，則退場
            setTimeout(() => {
                const libero = teamOnCourt.find(p => p.id.includes(`Libero_${team}`));
                if (libero && parseInt(libero.dataset.zone) === 4 && dir === 1) {
                    autoLiberoSwapOut(team, libero);
                }
            }, 350);

            updateAllLiberoControls();
        }

        // --- 換人邏輯 ---
        function performSubstitution(targetOnCourt, subFromBench) {
            // 資料紀錄 (如果是自由球員上場)
            if (subFromBench.id.includes('Libero')) {
                subFromBench.dataset.originalId = targetOnCourt.id;
            }

            const zone = targetOnCourt.dataset.zone;
            const tx = targetOnCourt.style.left;
            const ty = targetOnCourt.style.top;
            const team = targetOnCourt.dataset.team;

            // Sub 上場
            if (subFromBench.parentElement !== entitiesLayer) {
                subFromBench.parentElement.removeChild(subFromBench);
                entitiesLayer.appendChild(subFromBench);
                subFromBench.style.position = 'absolute';
                subFromBench.style.marginBottom = '0';
            }
            subFromBench.style.left = tx;
            subFromBench.style.top = ty;
            subFromBench.dataset.zone = zone;

            // Target 下場
            const targetBench = (team === 'A') ? benchA : benchB;
            targetOnCourt.style.position = 'relative';
            targetOnCourt.style.left = '0'; targetOnCourt.style.top = '0';
            targetOnCourt.style.marginBottom = '10px';

            if (targetOnCourt.parentElement === entitiesLayer) entitiesLayer.removeChild(targetOnCourt);
            targetBench.appendChild(targetOnCourt);
            targetOnCourt.dataset.zone = 'bench';

            updateAllLiberoControls();
        }

        // 自動退場
        function autoLiberoSwapOut(team, libero) {
            const originalId = libero.dataset.originalId;
            let originalPlayer = null;
            if (originalId) originalPlayer = document.getElementById(originalId);

            if (originalPlayer) {
                // 檢查 originalPlayer 是否在板凳上
                if (originalPlayer.parentElement !== entitiesLayer) {
                    performSubstitution(libero, originalPlayer);
                }
            } else {
                console.log(`${team}隊自由球員無對應替換紀錄`);
            }
        }

        // --- 自由球員 UI ---
        function updateAllLiberoControls() {
            updateLiberoUI('A'); updateLiberoUI('B');
        }

        function updateLiberoUI(team) {
            const container = document.getElementById(team === 'A' ? 'libero-controls-a' : 'libero-controls-b');
            container.innerHTML = '';

            const players = Array.from(document.querySelectorAll('.entity'));
            const onCourt = players.filter(p => p.parentElement === entitiesLayer && p.dataset.team === team && !p.id.includes('Libero'));

            // 找對角線
            const pairs = [{ z1: 1, z2: 4 }, { z1: 2, z2: 5 }, { z1: 3, z2: 6 }];

            pairs.forEach(pair => {
                const p1 = onCourt.find(p => parseInt(p.dataset.zone) === pair.z1);
                const p2 = onCourt.find(p => parseInt(p.dataset.zone) === pair.z2);
                if (p1 && p2) {
                    const btn = document.createElement('button');
                    btn.className = 'swap-btn';
                    btn.innerText = `換 ${p1.dataset.number} / ${p2.dataset.number}`;
                    btn.style.width = '100%';
                    btn.onclick = () => performLiberoSwap(team, p1, p2);
                    container.appendChild(btn);
                }
            });
        }

        function performLiberoSwap(team, p1, p2) {
            const libero = document.getElementById(team === 'A' ? 'Libero_A' : 'Libero_B');
            const active = [p1, p2, libero].filter(p => p.parentElement === entitiesLayer);

            if (active.includes(libero)) {
                // L 在場 -> 換下 L
                const benchP = [p1, p2].find(p => p.parentElement !== entitiesLayer);
                if (benchP) performSubstitution(libero, benchP);
            } else {
                // L 在板凳 -> 換上 L (換下後排)
                const backRow = [1, 5, 6];
                const target = [p1, p2].find(p => backRow.includes(parseInt(p.dataset.zone)));
                if (target) performSubstitution(target, libero);
                else alert("該組球員皆在前排，無法換自由");
            }
        }

        // --- 拖曳與畫圖 ---
        function startDrag(e) {
            if (mode !== 'move') return;
            e.preventDefault();
            draggedEntity = e.currentTarget;

            if (draggedEntity.parentElement !== entitiesLayer) {
                const rect = draggedEntity.getBoundingClientRect();
                const cRect = container.getBoundingClientRect();
                draggedEntity.parentElement.removeChild(draggedEntity);
                entitiesLayer.appendChild(draggedEntity);
                draggedEntity.style.position = 'absolute';
                draggedEntity.style.left = (rect.left - cRect.left) + 'px';
                draggedEntity.style.top = (rect.top - cRect.top) + 'px';
                draggedEntity.style.marginBottom = '0';
            }

            const rect = draggedEntity.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            touchOffsetX = clientX - rect.left;
            touchOffsetY = clientY - rect.top;
            draggedEntity.style.zIndex = 1000;
        }

        function onMove(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const cRect = container.getBoundingClientRect();

            if (draggedEntity && mode === 'move') {
                const x = clientX - cRect.left - touchOffsetX;
                const y = clientY - cRect.top - touchOffsetY;
                draggedEntity.style.left = x + 'px';
                draggedEntity.style.top = y + 'px';
                return;
            }

            if ((mode === 'draw' || mode === 'erase') && isDrawing) {
                const x = clientX - cRect.left;
                const y = clientY - cRect.top;
                ctx.beginPath();
                ctx.lineCap = 'round';
                if (mode === 'erase') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = penSizeInput.value * 5;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = penColorInput.value;
                    ctx.lineWidth = penSizeInput.value;
                }
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
                lastX = x; lastY = y;
            }
        }

        function endDrag() {
            if (draggedEntity) {
                draggedEntity.style.zIndex = '';
                const x = parseFloat(draggedEntity.style.left);
                const y = parseFloat(draggedEntity.style.top);
                // 替補吸附
                if (draggedEntity.dataset.zone === 'bench') {
                    const swapped = checkForSubstitution(draggedEntity, x, y);
                    if (!swapped) {
                        if (x < -20 || x > 340) returnToBench(draggedEntity);
                    }
                } else {
                    if (x < -40 || x > 380) returnToBench(draggedEntity);
                }
                draggedEntity = null;
            }
            isDrawing = false;
        }

        function checkForSubstitution(sub, x, y) {
            const onCourtPlayers = Array.from(entitiesLayer.querySelectorAll('.entity:not(.ball)'));
            let target = null; let minDist = 40;
            onCourtPlayers.forEach(p => {
                if (p === sub) return;
                if (p.dataset.team !== sub.dataset.team) return;
                const px = parseFloat(p.style.left);
                const py = parseFloat(p.style.top);
                const dist = Math.sqrt(Math.pow(x - px, 2) + Math.pow(y - py, 2));
                if (dist < minDist) { minDist = dist; target = p; }
            });

            if (target) {
                performSubstitution(target, sub);
                return true;
            }
            return false;
        }

        function returnToBench(el) {
            const team = el.dataset.team;
            const targetBench = (team === 'A') ? benchA : benchB;
            el.style.position = 'relative'; el.style.left = '0'; el.style.top = '0'; el.style.marginBottom = '10px';
            if (el.parentElement === entitiesLayer) entitiesLayer.removeChild(el);
            targetBench.appendChild(el);
            el.dataset.zone = 'bench';
            updateAllLiberoControls();
        }

        const startDraw = (e) => {
            if (mode === 'move') return;
            isDrawing = true;
            const cRect = container.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastX = clientX - cRect.left;
            lastY = clientY - cRect.top;
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        container.addEventListener('mousedown', startDraw);
        container.addEventListener('touchstart', startDraw, { passive: false });

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.global-tools .tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + m).classList.add('active');
            canvas.style.pointerEvents = (mode === 'move') ? 'none' : 'auto';
        }

        function addPlayer(team) { createPlayer(team, 'N', '替補', 0, 0, 'bench'); }

        function openEditModal(el) {
            editTarget = el;
            document.getElementById('modal-num').value = el.dataset.number;
            document.getElementById('modal-name').value = el.dataset.name;
            document.getElementById('edit-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; editTarget = null; }
        function savePlayerEdit() {
            if (editTarget) {
                editTarget.dataset.number = document.getElementById('modal-num').value;
                editTarget.dataset.name = document.getElementById('modal-name').value;
                updatePlayerHTML(editTarget);
                updateAllLiberoControls();
            }
            closeModal();
        }

        initGame();
    </script>
</body>

</html>
